# Nuxt cloudflare-pages output: .output/public/_worker.js + static files
# Dashboard Deploy command is `npx wrangler deploy`, which needs `main` or
# `assets.directory`. Do not set pages_build_output_dir — wrangler then
# treats this as a Pages config and rejects the ASSETS binding.

name = "cxenertech-com"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
main = ".output/public/_worker.js"

[assets]
directory = ".output/public"
binding = "ASSETS"
