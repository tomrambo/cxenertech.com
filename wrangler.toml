# Nitro `cloudflare-pages` (nitropack 2.13+) writes:
#   dist/_worker.js/index.js  + static files in dist/
# Dashboard Deploy command is `npx wrangler deploy`, which needs `main` or
# `assets.directory`. Do not set pages_build_output_dir — wrangler then
# treats this as a Pages config and rejects the ASSETS binding.

name = "cxenertech-com"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
main = "dist/_worker.js/index.js"

[assets]
directory = "dist"
binding = "ASSETS"
