name: Deploy Nuxt to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build for Cloudflare Pages (static + Worker)
        run: npm run build
        env:
          NUXT_CMMS_API_BASE_URL: ${{ secrets.NUXT_CMMS_API_BASE_URL }}
          PARTNER_INGEST_SECRET: ${{ secrets.PARTNER_INGEST_SECRET }}
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
